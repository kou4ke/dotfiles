[general]
import = [
  "themes/wombat.toml"
]

[selection]
semantic_escape_chars = ",│`|:\"' ()[]{}<>\t"
save_to_clipboard = true

[mouse]
bindings = [
  { mouse = "Right", mods = "Shift", action = "Paste" },

  { mouse = "Left", mods = "Shift", action = "Copy" },
]

# [terminal]
# shell = { program = "/bin/zsh", args = ["--login"] }

[font]
size = 11
offset = { x = 1, y = 0 }
[font.normal]
family = "PlemolJP Console NF"
# style = "Medium"
style = "Text"

[font.bold]
family = "PlemolJP Console NF"
style = "Bold"

[font.italic]
family = "PlemolJP Console NF"
style = "Italic"

[font.bold_italic]
family = "PlemolJP Console NF"
style = "Bold Italic"

[window]
decorations = "full"
opacity = 0.85

[debug]
log_level = "warn"
